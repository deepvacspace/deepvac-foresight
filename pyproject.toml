[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepvac"
version = "0.1.0"
description = "Digital-twin and PID optimization tools for the Deepvac chamber"
readme = "README.md"
requires-python = ">=3.10,<3.11"
# Only Python 3.10 is supported/validated (environment.yml pins 3.10.19).
# The upper bound is deliberate: torch==2.12.0 and the sklearn-checkpoint
# unpickling shim in digitaltwin/common.py are only validated there.
dependencies = []

[project.optional-dependencies]
# Chamber protocol, PID/BO helpers, and inference with an already-trained
# GRU/LSTM checkpoint. See requirements/runtime.lock.txt for exact pins.
runtime = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "torch==2.12.0",
]
# Training new models: runtime + plotting, hyperparameter search, experiment
# tracking. See requirements/training.lock.txt for exact pins.
training = [
  "deepvac[runtime]",
  "matplotlib==3.10.7",
  "mlflow==3.10.1",
  "optuna==4.7.0",
  "tensorboard==2.21.0",
]
# Plotting/analysis scripts only, without torch/scikit-learn. See
# requirements/visualization.lock.txt for exact pins.
visualization = [
  "matplotlib==3.10.7",
]
# Test tooling. See requirements/dev.lock.txt for exact pins.
dev = [
  "deepvac[training,package]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
# `deepvac package-model`'s ONNX export for control2-client (C++ Qt). See
# requirements/package.lock.txt for exact pins.
package = [
  "deepvac[runtime]",
  "onnx>=1.15,<2",
  "onnxruntime>=1.17,<2",
]
all = [
  "deepvac[training,visualization,dev,package]",
]

[project.scripts]
deepvac = "deepvac.cli:main"

[tool.setuptools]
packages = ["deepvac", "digitaltwin", "optimization", "tcp", "advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra --strict-config --strict-markers"
markers = [
  "slow: trains a real (tiny) model or otherwise runs noticeably longer than the rest of the suite; excluded by default via addopts in CI, run explicitly with `pytest -m slow`",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["deepvac", "digitaltwin", "optimization", "tcp", "advisor", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Legacy scripts (digitaltwin/, optimization/) predate ruff adoption here and
# are not being reformatted wholesale as part of adding tests -- new/shared
# code (deepvac/, tests/) is held to the full rule set.
[tool.ruff.lint.per-file-ignores]
"digitaltwin/*.py" = ["E501"]
"optimization/*.py" = ["E501"]
"advisor/*.py" = ["E501"]
