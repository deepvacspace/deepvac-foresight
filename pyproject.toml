[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepvac"
version = "0.1.0"
description = "Digital-twin and PID optimization tools for the Deepvac chamber"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "matplotlib==3.10.7",
  "mlflow==3.10.1",
  "numpy==2.2.6",
  "optuna==4.7.0",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "torch==2.12.0",
]

[tool.setuptools]
packages = ["gru", "lstm", "optimization", "tcp", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
