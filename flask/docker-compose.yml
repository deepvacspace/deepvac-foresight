services:
  web:
    build:
      context: ./deepvac
      dockerfile: Dockerfile
      target: dev
    networks:
      - app-network
    environment:
      - TZ=America/Mexico_City

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    env_file:
      - ./fastapi/.env.prod
    networks:
      - app-network

  nginx:
    image: nginx:latest
    depends_on:
      - web
      - fastapi
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
