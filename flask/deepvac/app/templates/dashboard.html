<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepVac Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v=20260602f">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span>DeepVac</span>
      </div>
      <button id="sidebarToggle" class="icon-button" aria-label="Show sidebar" title="Show sidebar" type="button"><span aria-hidden="true">&#9776;</span></button>
      <nav class="tool-tabs" aria-label="Dashboard tools">
        <button id="runsToolTab" class="tool-tab active" type="button" data-tool="runs">Runs</button>
        <button id="simToolTab" class="tool-tab" type="button" data-tool="simulator">GRU Simulator</button>
      </nav>
      <div class="top-actions">
        <button id="refreshRuns" class="icon-button" aria-label="Refresh runs" title="Refresh runs" type="button"><span aria-hidden="true">&#8635;</span></button>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle light and dark mode" title="Switch to light mode" type="button">
          <span class="theme-icon" aria-hidden="true">◐</span>
        </button>
      </div>
    </header>

    <aside class="sidebar" id="runsSidebar">
      <div class="sidebar-head">
        <div>
          <p class="eyebrow">Data Source</p>
          <strong id="dataRoot">Loading...</strong>
        </div>
        <label class="search sidebar-search">
          <span>Search</span>
          <input id="runSearch" type="search" placeholder="run id">
        </label>
      </div>
      <div class="run-list" id="runList"></div>
    </aside>

    <main class="workspace tool-view active" id="runsTool">
      <section class="summary-strip" id="summaryStrip"></section>

      <section class="panel chart-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Time Series</p>
            <h1 id="activeRunTitle">Select a run</h1>
          </div>
          <div class="toolbar">
            <label class="setpoint-control" title="Show setpoint reference line while comparing runs">
              <input id="showSetpoint" type="checkbox" checked disabled>
              <span>Setpoint</span>
              <input id="setpointValue" type="number" step="0.1" value="0" disabled>
            </label>
            <button id="resetZoom" type="button">Reset</button>
            <select id="chartMode" title="Chart mode">
              <option value="line">Line</option>
              <option value="scatter">Scatter</option>
            </select>
            <div class="download-menu">
              <button id="downloadToggle" type="button" aria-haspopup="menu" aria-expanded="false">Download</button>
              <div id="downloadMenu" class="download-menu-panel" role="menu">
                <button id="exportChart" type="button" role="menuitem">Chart PNG</button>
                <button id="exportRunCsv" type="button" role="menuitem">Run CSV</button>
                <button id="exportCompareCsv" type="button" role="menuitem">Comparison CSV</button>
                <button id="openReport" type="button" role="menuitem">Run Report</button>
              </div>
            </div>
          </div>
        </div>
        <div class="chart-stage">
          <canvas id="mainChart" height="520"></canvas>
          <div class="chart-tooltip" id="mainTooltip"></div>
          <div class="plot-spinner chart-loading" id="mainSpinner">
            <div class="spinner-ring"></div>
            <span>Loading run</span>
          </div>
        </div>
        <div class="legend" id="legend"></div>
      </section>

      <section class="lower-grid">
        <div class="panel">
          <div class="panel-head compact">
            <div>
              <p class="eyebrow">Variables</p>
              <h2>Channels</h2>
            </div>
            <button id="toggleChannels" type="button">Select All</button>
          </div>
          <div id="channelList" class="channel-list"></div>
        </div>

        <div class="panel">
          <div class="panel-head compact">
            <div>
              <p class="eyebrow">Run Details</p>
              <h2>Statistics</h2>
            </div>
          </div>
          <div class="stats-block">
            <h3>Band Metrics</h3>
            <div id="bandMetrics" class="metric-table"></div>
          </div>
          <div class="stats-block">
            <h3>Run Summary</h3>
            <div class="table-wrap">
              <table id="comparisonTable"></table>
            </div>
          </div>
        </div>
      </section>

      <section class="panel table-panel" id="samplePanel">
        <div class="panel-head compact">
          <div>
            <p class="eyebrow">Samples</p>
            <h2>Raw Data</h2>
          </div>
        </div>
        <div class="table-wrap">
          <table id="sampleTable"></table>
        </div>
      </section>
    </main>

    <main class="workspace tool-view" id="simulatorTool">
      <section class="panel sim-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">GRU Model</p>
            <h1>PID Run Simulator</h1>
          </div>
          <button id="runSimulation" type="button">Run Simulation</button>
        </div>
        <form id="simForm" class="sim-form">
          <label>Kp <input name="kp" type="number" min="1" max="50" step="0.1" value="7"></label>
          <label>Ki <input name="ki" type="number" min="1" max="1000" step="1" value="700"></label>
          <label>Kd <input name="kd" type="number" min="1" max="20" step="0.1" value="10"></label>
          <label>Start Temp <input name="start_temp" type="number" step="0.1" value="27"></label>
          <label>Target Temp <input name="target_temp" type="number" step="0.1" value="0"></label>
          <label>Duration s <input name="duration_s" type="number" step="10" value="1200"></label>
          <label>Step s <input name="dt_s" type="number" step="0.1" value="2"></label>
          <label>Initial P <input name="initial_p" type="number" step="0.001" value="0"></label>
          <label>Initial I <input name="initial_i" type="number" step="0.001" value="0"></label>
          <label>Initial D <input name="initial_d" type="number" step="0.001" value="0"></label>
        </form>
      </section>

      <section class="summary-strip" id="simSummaryStrip"></section>

      <section class="panel chart-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Synthetic Run</p>
            <h1 id="simTitle">Awaiting simulation</h1>
          </div>
          <div class="toolbar">
            <select id="simChannel" title="Simulation channel">
              <option value="temp">Temperature</option>
              <option value="error">Error</option>
              <option value="u">Control</option>
              <option value="pred_delta">Predicted Delta</option>
            </select>
          </div>
        </div>
        <div class="chart-stage">
          <canvas id="simChart" height="520"></canvas>
          <div class="chart-tooltip" id="simTooltip"></div>
          <div class="plot-spinner" id="simSpinner">
            <div class="spinner-ring"></div>
            <span>Generating simulation</span>
          </div>
        </div>
        <div class="legend" id="simLegend"></div>
      </section>
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}?v=20260602f"></script>
</body>
</html>
